# Producción: los valores sensibles vienen de variables de entorno, nunca escritos aquí
server:
  port: ${SERVER_PORT:9083}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://servidor-bd:3306/bd_postulacion_daw}
    username: ${DB_USER:app_postulaciones}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate # exige que las tablas ya existan (sql/bases-daw.sql)
    show-sql: false

servicios:
  vacante:
    url: ${VACANTE_URL:http://servidor-vacante:9082}
